<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Messages</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">

    <article class="message-card" id="messageCard">

      <header class="message-header">

        <img
          class="avatar"
          src="avatar.gif"
          alt=""
        >

        <span class="username">tete</span>

        <span class="username-extra">
          dO NOT answer (¬_¬")
        </span>

      </header>


      <!--
        This wrapper is what fades between messages.
      -->
      <div class="content-wrapper" id="contentWrapper">

        <div class="message-pill" id="message">
        </div>

        <div class="image-pill" id="imageContainer">
          <img id="messageImage" src="" alt="">
        </div>

      </div>

    </article>

  </main>


  <script src="script.js"></script>

</body>
</html>
